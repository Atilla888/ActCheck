<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#285849" />
    <meta name="description" content="ActCheck helps you review renovation quantities with clear measurements, visual evidence, and questions for your contractor." />
    <script>
      try {
        const theme = localStorage.getItem('actcheck.theme');
        const dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        const locale = localStorage.getItem('actcheck.locale');
        if (['en', 'ru', 'kk'].includes(locale)) document.documentElement.lang = locale;
      } catch {}
    </script>
    <title>ActCheck — Renovation inspection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
