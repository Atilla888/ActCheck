[project]
name = "actcheck"
version = "0.1.0"
description = "Tile-based renovation measurement and contractor statement comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28,<1",
    "meta-sam-parser==0.1.0",
    "numpy>=2,<3",
    "openai==3.41.0",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "scipy>=1.14,<2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
