[project]
name = "actcheck"
version = "0.1.0"
description = "Tile-based renovation measurement and contractor statement comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "openai>=2,<4",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
app = ["fastapi>=0.115,<1", "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
